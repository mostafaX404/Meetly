<dialog #filterModal class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">Select filters</h3>

    <div class="flex justify-between w-full items-center mt-6">
      <div class="flex flex-col w-full gap-6">

        <!-- Gender Selection -->
        <label class="flex justify-between items-center">
          <span class="font-semibold">Select gender:</span>
          <form class="filter">
            <input type="reset" value="x" class="btn btn-square">

            <input type="radio" class="btn" aria-label="Male" [(ngModel)]="memberParams().gender" name="gender"
              value="male">

            <input type="radio" aria-label="Female" class="btn" [(ngModel)]="memberParams().gender" name="gender"
              value="female">
          </form>
        </label>

        <!-- Age Selection -->
        <label class="flex justify-between items-center">
          <span class="font-semibold">Select age</span>
          <div class="flex gap-3">

            <!-- Min Age -->
            <input type="number" class="input w-20" [min]="18" [(ngModel)]="memberParams().minAge" name="minAge"
              (change)="onMinAgeChange()">

            <!-- Max Age -->
            <input type="number" class="input w-20" [min]="memberParams().minAge || 18" [(ngModel)]="memberParams().maxAge"
              name="maxAge" (change)="onMaxAgeChange()">

          </div>
        </label>

        <label class="flex justify-between items-center">
          <span class="font-semibold">Order by: </span>
          <select name="orderBy" class="select" [(ngModel)]="memberParams().orderBy">
            <option disabled selected>Order by</option>
            <option value="created">Newest members</option>
            <option value="lastActive">Last active</option>
          </select>
        </label>

      </div>
    </div>


    <div class="modal-action">
      <button (click)="submit()" class="btn btn-primary">Submit</button>
    </div>
  </div>

  <form method="dialog" class="modal-backdrop">
    <button (click)="close()">Close</button>
  </form>
</dialog>
