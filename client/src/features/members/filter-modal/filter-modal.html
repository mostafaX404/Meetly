<dialog #filterModal class="modal">
  <div class="modal-box glass-panel rounded-2xl shadow-2xl">
    <div class="flex items-center gap-3 mb-2">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-5 text-primary">
        <path fill-rule="evenodd"
          d="M2.628 1.601C5.028 1.601 7.06 3.07 8 5.051 8.94 3.07 10.972 1.601 13.372 1.601 16.856 1.601 19.628 4.373 19.628 7.857c0 2.528-1.087 4.851-2.824 6.494l-6.077 6.077a1.5 1.5 0 0 1-2.122 0l-6.077-6.077C1.715 12.708.628 10.385.628 7.857.628 4.373 3.4 1.601 6.884 1.601H8c.972 0 1.872.35 2.628.951V1.601Z"
          clip-rule="evenodd" />
      </svg>
      <h3 class="font-display text-xl font-bold">Find your match</h3>
    </div>
    <p class="text-sm text-base-content/60 mb-6">Refine who you see based on your preferences</p>

    <div class="flex flex-col w-full gap-6">
      <label class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
        <span class="font-semibold">Gender</span>
        <form class="filter">
          <input type="reset" value="×" class="btn btn-square btn-sm">
          <input type="radio" class="btn btn-sm" aria-label="Male" [(ngModel)]="memberParams().gender" name="gender"
            value="male">
          <input type="radio" aria-label="Female" class="btn btn-sm" [(ngModel)]="memberParams().gender" name="gender"
            value="female">
        </form>
      </label>

      <label class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
        <span class="font-semibold">Age range</span>
        <div class="flex gap-3 items-center">
          <input type="number" class="input input-sm w-20" [min]="18" [(ngModel)]="memberParams().minAge"
            name="minAge" (change)="onMinAgeChange()">
          <span class="text-base-content/50">to</span>
          <input type="number" class="input input-sm w-20" [min]="memberParams().minAge || 18"
            [(ngModel)]="memberParams().maxAge" name="maxAge" (change)="onMaxAgeChange()">
        </div>
      </label>

      <label class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
        <span class="font-semibold">Order by</span>
        <select name="orderBy" class="select select-sm" [(ngModel)]="memberParams().orderBy">
          <option disabled selected>Order by</option>
          <option value="created">Newest members</option>
          <option value="lastActive">Last active</option>
        </select>
      </label>
    </div>

    <div class="modal-action">
      <button (click)="submit()" class="btn btn-primary btn-glow">Apply Filters</button>
    </div>
  </div>

  <form method="dialog" class="modal-backdrop">
    <button (click)="close()">Close</button>
  </form>
</dialog>
