<div class="hero hero-mesh min-h-screen relative overflow-hidden">
    <!-- Decorative floating hearts -->
    <svg class="floating-heart absolute top-20 left-[10%] size-16 text-primary" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <svg class="floating-heart absolute top-40 right-[15%] size-12 text-secondary" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
    <svg class="floating-heart absolute bottom-32 left-[20%] size-10 text-accent" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>

    @if (!this.registerMode()) {
    <div class="hero-content text-center z-10 page-enter">
        <div class="flex flex-col items-center max-w-2xl">
            <div class="relative flex items-center mb-6 logo-heartbeat">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                    class="size-20 text-primary -rotate-12 drop-shadow-lg">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                    class="size-20 text-secondary -ml-8 rotate-6 drop-shadow-lg">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>
            <h1 class="font-display text-5xl md:text-6xl font-bold text-base-content leading-tight">
                Find your <span class="text-primary">perfect match</span>
            </h1>
            <p class="py-6 text-lg text-base-content/70 max-w-md">
                Real connections start here. Join thousands of people looking for something meaningful.
            </p>
            <div class="flex flex-wrap items-center justify-center gap-4">
                <button (click)="showRegister(true)" class="btn btn-primary btn-lg btn-glow px-8 shadow-lg">
                    Get Started
                </button>
                <button class="btn btn-outline btn-lg border-primary/30 hover:border-primary hover:bg-primary/5">
                    Learn More
                </button>
            </div>
        </div>
    </div>
    } @else {
    <div class="w-full flex justify-center z-10 page-enter py-8">
        <app-register (cancelRegister)="showRegister($event)"></app-register>
    </div>
    }
</div>
